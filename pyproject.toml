[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "south-london-street-works-monitor"
version = "0.1.0"
description = "Monitors roadworks across south London boroughs and populates Notion databases for LCC cycling groups"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "shapely>=2.0",
    "pyproj>=3.7",
    "notion-client>=2.2.0",
    "anthropic>=0.42.0",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
